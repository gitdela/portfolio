name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run, except on main where every
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Must match `packageManager` in package.json; the first job asserts that it does.
  BUN_VERSION: 1.3.13
  # Remote caching is optional. Turborepo ignores these when they are absent.
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `turbo --affected` can diff against the base commit.
          fetch-depth: 0

      - name: Install Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Assert the pinned Bun version matches packageManager
        run: |
          declared="$(bun --print 'require("./package.json").packageManager')"
          expected="bun@${BUN_VERSION}"
          if [ "$declared" != "$expected" ]; then
            echo "::error::packageManager is '$declared' but the workflow pins '$expected'. Update both together."
            exit 1
          fi
          echo "Bun $(bun --version), matching $declared"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Schema extraction and TypeGen read local files only — no network, no real project —
      # so placeholder values are enough to load the Studio config.
      - name: Regenerate Sanity schema and types
        working-directory: apps/studio
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID || 'ci000000' }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET || 'production' }}
          SANITY_STUDIO_PREVIEW_URL: http://localhost:3000
        run: bun run typegen

      - name: Fail if the generated schema or types drifted
        run: |
          if ! git diff --exit-code -- packages/sanity/schema.json packages/sanity/src/generated/; then
            echo "::error::Generated Sanity artifacts are out of date. Run 'bun run typegen' in apps/studio and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # The build runs against the local GROQ stand-in loaded with the development fixture,
      # so it needs no Sanity credentials and cannot fail because someone edited content.
      # Using the fixture rather than an empty dataset means generateStaticParams actually
      # produces the case-study and post pages, so those routes get built. Vercel's own
      # build is what exercises the real dataset on deploy.
      - name: Start the Sanity stand-in
        env:
          MOCK_SANITY_DATASET_FILE: apps/web/scripts/fixtures/seed.ts
        run: |
          bun run apps/web/scripts/mock-sanity.ts &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:3999/v2026-08-01/data/query/production?query=count(*)" >/dev/null; then
              echo "stand-in ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The Sanity stand-in did not start within 30s."
          exit 1

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SANITY_PROJECT_ID: offline
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2026-08-01"
          NEXT_PUBLIC_SANITY_STUDIO_URL: http://localhost:3333
          NEXT_PUBLIC_SANITY_API_HOST: http://localhost:3999
          # Cloudflare's published always-pass test keys. Not credentials.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          SANITY_API_READ_TOKEN: ci-no-token
          SANITY_REVALIDATE_SECRET: ci-no-secret
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_EMAIL: contact@send.example.com
          CONTACT_TO_EMAIL: ci@example.com
          # `turbo run build` covers both workspaces, and `sanity build` re-runs schema
          # extraction, so the Studio needs its config here as well as on the typegen step.
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID || 'ci000000' }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET || 'production' }}
          SANITY_STUDIO_PREVIEW_URL: http://localhost:3000
        run: |
          # `--affected` needs a reliable base commit. A pull request has one; a push to main
          # does not always (a force-push or first commit gives no usable `before`), so that
          # builds everything.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" \
            TURBO_SCM_HEAD="${{ github.sha }}" \
              bunx turbo run build --affected
          else
            bunx turbo run build
          fi

      - name: Stop the Sanity stand-in
        if: always()
        run: kill "$MOCK_PID" 2>/dev/null || true

  deploy-studio:
    name: Deploy Studio
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Skipped rather than failed when the token is absent, so a fresh clone still gets a
      # green pipeline.
      - name: Check for a deploy token
        id: token
        run: echo "present=${{ secrets.SANITY_AUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy Sanity Studio
        if: steps.token.outputs.present == 'true'
        working-directory: apps/studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET || 'production' }}
          SANITY_STUDIO_PREVIEW_URL: ${{ vars.SANITY_STUDIO_PREVIEW_URL }}
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}
        run: bunx sanity deploy

      - name: Note the skip
        if: steps.token.outputs.present != 'true'
        run: echo "::notice::SANITY_AUTH_TOKEN is not set, so the Studio deploy was skipped."
# The web app is deployed by Vercel's Git integration, not from here.
